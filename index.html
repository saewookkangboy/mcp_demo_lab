<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP Demo Lab</title><link rel="stylesheet" href="/shared/ui/styles.css"></head>
<body><main><p class="eyebrow">MCP Demo Lab</p><h1>도구 연결을 눈으로 배우는 5개 실습</h1><p class="lead">기본 데모는 가상 데이터와 mock으로 안전하게 시작합니다. 각 데모에서 실제 오픈소스 MCP 확장 경로를 확인하고, 대화형 검색에서는 공식 외부 MCP를 직접 호출할 수 있습니다.</p><section class="grid" id="projects"></section></main>
<script>const items=[['01-instructor-meeting-notes','강사 시연','회의록 작성','Filesystem MCP'],['02-instructor-quote','강사 시연','견적서 작성','Git MCP'],['03-beginner-blueprint','초급','설계도 제작','Playwright MCP'],['04-intermediate-conversational-search','중급','대화형 검색','LIVE · 공식 Docs MCP'],['05-advanced-memory','고급','데이터 기반 메모리','Memory MCP']];document.querySelector('#projects').innerHTML=items.map(([path,level,title,oss],i)=>`<a class="card" href="/projects/${path}/" style="color:inherit;text-decoration:none"><span class="tag">${level}</span>${oss.startsWith('LIVE')?'<span class="tag live-tag">LIVE</span>':''}<h2>${i+1}. ${title}</h2><span class="harness-mini">Harness 적용/미적용 비교</span><span class="oss-mini">OSS 확장 · ${oss}</span><p>데모 열기 →</p></a>`).join('')</script></body></html>
